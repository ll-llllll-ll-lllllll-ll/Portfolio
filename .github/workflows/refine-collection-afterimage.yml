name: Refine collection afterimage

on:
  push:
    paths:
      - '.github/workflows/refine-collection-afterimage.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make collection afterimage more visible
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          style_path = Path('style.css')
          style = style_path.read_text(encoding='utf-8')

          start = style.index('/*\n  Collection after-image field')
          media = style.index('@media (max-width: 760px) {', start)

          new_block = '''/*
  Collection after-image field
  ----------------------------
  One generated monochrome light sheet drifts behind every collection image.
  The motion is deliberately large enough to read at the exposed grey margins,
  while moderate blur and a faint dither layer soften visible gradient banding.
*/
.room-view[data-group="collection"] .room-image {
  isolation: isolate;
  background: #858581;
}

.room-view[data-group="collection"] .room-image::before {
  position: absolute;
  z-index: 0;
  inset: -22%;
  content: "";
  pointer-events: none;
  opacity: 0.55;
  background:
    radial-gradient(ellipse at 18% 34%, rgba(246, 246, 238, 0.66) 0 7%, rgba(206, 206, 199, 0.30) 17%, transparent 34%),
    radial-gradient(ellipse at 78% 44%, rgba(232, 232, 224, 0.54) 0 8%, rgba(186, 186, 180, 0.22) 18%, transparent 35%),
    radial-gradient(ellipse at 45% 82%, rgba(250, 250, 244, 0.38) 0 6%, rgba(188, 188, 182, 0.18) 18%, transparent 34%),
    radial-gradient(ellipse at 55% 18%, rgba(20, 20, 19, 0.76) 0 10%, rgba(45, 45, 43, 0.34) 26%, transparent 48%),
    linear-gradient(118deg, rgba(16, 16, 15, 0.96), rgba(102, 102, 97, 0.72) 43%, rgba(26, 26, 25, 0.92) 72%, rgba(9, 9, 9, 0.98));
  filter: grayscale(1) blur(18px);
  transform-origin: 50% 50%;
  transform: scale(1.14) translate3d(-9%, -4%, 0) rotate(-1.2deg);
  animation: collection-afterimage 9s cubic-bezier(.42, 0, .25, 1) infinite alternate;
  will-change: transform, opacity;
}

/* Subtle dither breaks up flat 8-bit gradient bands without reading as grain. */
.room-view[data-group="collection"] .room-image::after {
  position: absolute;
  z-index: 1;
  inset: 0;
  content: "";
  pointer-events: none;
  opacity: 0.055;
  background-image:
    radial-gradient(rgba(255, 255, 255, 0.46) 0.55px, transparent 0.72px),
    radial-gradient(rgba(0, 0, 0, 0.34) 0.5px, transparent 0.70px);
  background-position: 0 0, 3px 4px;
  background-size: 7px 7px, 9px 9px;
  mix-blend-mode: soft-light;
}

@keyframes collection-afterimage {
  0% {
    transform: scale(1.14) translate3d(-11%, -5%, 0) rotate(-1.4deg);
    opacity: 0.42;
  }
  25% {
    transform: scale(1.23) translate3d(7%, -8%, 0) rotate(0.9deg);
    opacity: 0.68;
  }
  52% {
    transform: scale(1.17) translate3d(11%, 7%, 0) rotate(1.6deg);
    opacity: 0.50;
  }
  76% {
    transform: scale(1.27) translate3d(-7%, 9%, 0) rotate(-0.7deg);
    opacity: 0.72;
  }
  100% {
    transform: scale(1.18) translate3d(-12%, 2%, 0) rotate(-1.8deg);
    opacity: 0.48;
  }
}

'''

          # Remove the old generic field and the old room-by-the-lake video-specific CSS.
          style = style[:start] + new_block + style[media:]

          # Remove obsolete mobile rules that only styled the retired ripple video/veil.
          style = re.sub(r'\n\s*\.room-image-ripple \{.*?\n\s*\}\n\n\s*\.room-image-ripple-veil \{.*?\n\s*\}\n', '\n', style, flags=re.S)

          # Strengthen mobile motion while keeping the same one-sheet mechanism.
          old_mobile = '''  .room-view[data-group="collection"] .room-image::before {
    inset: -34%;
    opacity: 0.56;
    filter: grayscale(1) blur(0);
    animation-duration: 11s;
  }
'''
          new_mobile = '''  .room-view[data-group="collection"] .room-image::before {
    inset: -26%;
    opacity: 0.62;
    filter: grayscale(1) blur(14px);
    animation-duration: 8s;
  }

  .room-view[data-group="collection"] .room-image::after {
    opacity: 0.065;
  }
'''
          if old_mobile not in style:
              raise SystemExit('Expected old mobile afterimage block not found')
          style = style.replace(old_mobile, new_mobile)

          # Reduced-motion keeps a legible static field rather than removing the effect.
          style = style.replace(
              '    transform: scale(1.12);\n    opacity: 0.40;',
              '    transform: scale(1.18) translate3d(-4%, 2%, 0);\n    opacity: 0.52;\n    filter: grayscale(1) blur(18px);'
          )

          style_path.write_text(style, encoding='utf-8')

          script_path = Path('script.js')
          script = script_path.read_text(encoding='utf-8')
          # Stop injecting the external water video. room-by-the-lake now uses exactly
          # the same generated light-sheet field as every other collection page.
          call = '    addRippleHallucination(item);\n'
          if call not in script:
              raise SystemExit('Expected ripple injection call not found')
          script = script.replace(call, '')
          script = script.replace(
              '  - adds the very soft ripple hallucination behind room by the lake\n',
              '  - keeps every collection on the same generated after-image field\n'
          )
          script_path.write_text(script, encoding='utf-8')
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check script.js
          grep -q 'blur(18px)' style.css
          grep -q 'collection-afterimage 9s' style.css
          ! grep -q 'addRippleHallucination(item);' script.js

      - name: Commit refinement
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add style.css script.js
          git commit -m 'Strengthen generated collection afterimage motion'
          git push
