name: Refine collection afterimage

on:
  push:
    paths:
      - '.github/workflows/refine-collection-afterimage.yml'
      - 'tools/refine_collection_afterimage.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply refinement
        run: python3 tools/refine_collection_afterimage.py

      - name: Validate JavaScript
        run: node --check script.js

      - name: Validate CSS markers
        run: |
          grep -q 'blur(18px)' style.css
          grep -q 'collection-afterimage 9s' style.css
          if grep -q 'addRippleHallucination(item);' script.js; then exit 1; fi

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add style.css script.js
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Strengthen generated collection afterimage motion'
            git push
          fi
