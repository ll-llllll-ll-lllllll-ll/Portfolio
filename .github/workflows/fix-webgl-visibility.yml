name: Fix WebGL visibility

on:
  push:
    paths:
      - '.github/workflows/fix-webgl-visibility.yml'
      - 'tools/fix_webgl_visibility.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply fix
        run: python3 tools/fix_webgl_visibility.py

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check script.js
          grep -q 'seawaterRenderer = "webgl"' script.js
          grep -q 'vec3 base = vec3(0.815, 0.815, 0.795)' script.js
          grep -q 'style.css?v=20260929-0242' index.html
          grep -q 'script.js?v=20260929-0242' index.html

      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add script.js index.html
          git commit -m 'Fix WebGL caustics visibility on light theme'
          git push
