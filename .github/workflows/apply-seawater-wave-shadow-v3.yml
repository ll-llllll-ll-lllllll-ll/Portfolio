name: Apply seawater wave-shadow v3

on:
  push:
    paths:
      - '.github/workflows/apply-seawater-wave-shadow-v3.yml'
      - 'tools/apply_seawater_wave_shadow_v3.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply refinement
        run: python3 tools/apply_seawater_wave_shadow_v3.py

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check script.js
          grep -q 'now \* 0.00022' script.js
          grep -q 'var core = Math.pow(ridge, 11.5)' script.js
          grep -q 'fillHullBlur(broadHull' script.js
          grep -q 'fillHullBlur(contactHull, 0.76, 0)' script.js
          grep -q 'var bands = mobile ? 9 : 12' script.js
          grep -q 'fieldInterval = width <= 760 ? 40 : 32' script.js
          grep -q 'filter: blur(1.25px)' style.css

      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add script.js style.css
          git commit -m 'Increase seawater caustic contrast and shadow depth'
          git push
