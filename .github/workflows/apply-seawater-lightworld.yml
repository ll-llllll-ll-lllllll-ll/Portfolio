name: Apply seawater long-space light world

on:
  push:
    paths:
      - '.github/workflows/apply-seawater-lightworld.yml'
      - 'tools/apply_seawater_lightworld.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply light-space patch
        run: python3 tools/apply_seawater_lightworld.py

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check script.js
          grep -q 'function mountSeawaterWorld' script.js
          grep -q 'function shadowHull' script.js
          grep -q 'mountSeawaterWorld(item);' script.js
          grep -q 'Seawater long-space light world' style.css
          grep -q 'seawater-world-light' style.css
          ! grep -q 'mountSeawaterCaustics(item);' script.js

      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add style.css script.js
          git commit -m 'Build scroll-linked seawater light space'
          git push
