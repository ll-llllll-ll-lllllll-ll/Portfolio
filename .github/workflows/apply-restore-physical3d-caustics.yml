name: Apply physical 3D caustic projection

on:
  push:
    paths:
      - '.github/workflows/apply-restore-physical3d-caustics.yml'
      - 'tools/apply_restore_physical_3d_caustics.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply migration
        run: python3 tools/apply_restore_physical_3d_caustics.py

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check script.js
          grep -q 'buildPhysicalProjectedVolume' script.js
          grep -q 'volumeHull' script.js
          grep -q 'canvas2d-physical3d-caustics' script.js
          grep -q 'seawaterProjection = "point-light-xyz"' script.js
          grep -q 'script.js?v=20261003-0430' index.html
          ! grep -q 'buildWeakProjectedVolume' script.js
          ! grep -q 'softCtx.filter = "blur(' script.js

      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add script.js index.html
          git commit -m 'Restore physical 3D caustic projection'
          git push
