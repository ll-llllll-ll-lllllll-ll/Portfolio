name: Apply seawater resolution-speed v4

on:
  push:
    paths:
      - '.github/workflows/apply-seawater-resolution-speed-v4.yml'
      - 'tools/apply_seawater_resolution_speed_v4.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply refinement
        run: python3 tools/apply_seawater_resolution_speed_v4.py

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check script.js
          grep -q 'Math.min(560, Math.max(420' script.js
          grep -q 'now \* 0.00125' script.js
          grep -q 'Math.pow(ridge, 9.0)' script.js
          grep -q 'imageSmoothingQuality = "high"' script.js
          grep -q 'filter: blur(0.35px)' style.css

      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add script.js style.css
          git commit -m 'Sharpen and accelerate seawater caustics'
          git push
