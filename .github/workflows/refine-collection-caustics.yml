name: Refine collection caustics

on:
  push:
    paths:
      - '.github/workflows/refine-collection-caustics.yml'
      - 'tools/refine_collection_caustics.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply refinement
        run: python3 tools/refine_collection_caustics.py

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check script.js
          grep -q 'collection-afterimage-flow 26s linear infinite' style.css
          grep -q 'seawater-caustics' style.css
          grep -q 'mountSeawaterCaustics(item);' script.js
          if grep -q 'seawater-sun-orbit' style.css; then exit 1; fi
          if grep -q 'addRippleHallucination(item)' script.js; then exit 1; fi

      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add style.css script.js
          git commit -m 'Smooth collection flow and add seawater caustics'
          git push
