name: Apply Ruin Archive frame v2

on:
  push:
    paths:
      - 'tools/apply-ruin-frame-v2.py'
      - '.github/workflows/apply-ruin-frame-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python tools/apply-ruin-frame-v2.py
      - name: Validate site
        run: |
          node --check script.js
          grep -q 'perspective-top-left-transfer-v198' script.js
          grep -q 'main-frame-right-outward-tree-v148' script.js
          grep -q 'main-frame-left-stone-pit-v211' script.js
          grep -q 'index-drawer-visible-shell-pits-v291-opt30' script.js
          grep -q 'Ruin Archive v2 · faithful main-site frame miniature' style.css
          grep -q '20261006-ruinmini2' index.html
      - name: Commit site changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add script.js style.css index.html
          if git diff --cached --quiet; then
            echo 'No site changes to commit.'
            exit 0
          fi
          git commit -m 'Refine Ruin Archive miniature frame'
          git push
