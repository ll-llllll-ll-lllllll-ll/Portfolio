name: Fix seawater Water Caustics

on:
  push:
    paths:
      - '.github/workflows/fix-seawater-water-caustics.yml'
      - 'tools/fix_seawater_water_caustics.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply correction
        run: python3 tools/fix_seawater_water_caustics.py

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check script.js
          grep -q 'webgl-water-caustics-refraction' script.js
          grep -q 'float refractedCaustic' script.js
          ! grep -q 'float refractedWake' script.js
          grep -q 'Seawater Water Caustics correction' style.css
          grep -q 'script.js?v=20261002-1610' index.html

      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add script.js style.css index.html
          git commit -m 'Restore refracted Water Caustics on seawater page'
          git push
