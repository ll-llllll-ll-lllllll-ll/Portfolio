name: Diagnose mobile calendar video

on:
  push:
    branches:
      - diag-mobile-calendar
    paths:
      - '.github/workflows/diag-mobile-calendar.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Inspect current cloud WebM
        shell: bash
        run: |
          mkdir -p diagnostics
          {
            echo '=== SOURCE WEBM ==='
            ffprobe -v error \
              -show_entries stream=index,codec_name,codec_long_name,profile,pix_fmt,width,height,r_frame_rate \
              -show_entries format=format_name,duration,size,bit_rate \
              -of default=noprint_wrappers=1 \
              calendar/cloud/1.webm
          } | tee diagnostics/mobile-calendar.txt

      - name: Build one Safari-safe MP4 test file
        shell: bash
        run: |
          ffmpeg -y -i calendar/cloud/1.webm \
            -map 0:v:0 -an \
            -vf "scale='min(1280,iw)':-2:flags=lanczos" \
            -c:v libx264 \
            -profile:v main \
            -level:v 3.1 \
            -pix_fmt yuv420p \
            -preset veryfast \
            -crf 25 \
            -movflags +faststart \
            calendar/cloud/1.mp4

      - name: Validate generated MP4 and decode a real frame
        shell: bash
        run: |
          {
            echo
            echo '=== GENERATED MP4 ==='
            ffprobe -v error \
              -show_entries stream=index,codec_name,codec_long_name,profile,pix_fmt,width,height,r_frame_rate \
              -show_entries format=format_name,duration,size,bit_rate \
              -of default=noprint_wrappers=1 \
              calendar/cloud/1.mp4
            echo
            echo '=== DECODE TEST ==='
          } | tee -a diagnostics/mobile-calendar.txt

          ffmpeg -v error -ss 1 -i calendar/cloud/1.mp4 -frames:v 1 -f null -
          echo 'decoded_frame_at_1s=PASS' | tee -a diagnostics/mobile-calendar.txt

          python - <<'PY' | tee -a diagnostics/mobile-calendar.txt
          from pathlib import Path
          p = Path('calendar/cloud/1.mp4').read_bytes()
          moov = p.find(b'moov')
          mdat = p.find(b'mdat')
          print(f'moov_offset={moov}')
          print(f'mdat_offset={mdat}')
          print('faststart=' + ('PASS' if 0 <= moov < mdat else 'FAIL'))
          PY

      - name: Commit diagnostic output only to diagnostic branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add calendar/cloud/1.mp4 diagnostics/mobile-calendar.txt
          git commit -m 'Diagnostic: generate Safari-safe cloud MP4 and report'
          git push
