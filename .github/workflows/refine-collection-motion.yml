name: Refine collection motion

on:
  push:
    paths:
      - '.github/workflows/refine-collection-motion.yml'
      - 'tools/refine_collection_motion.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply refinement
        run: python3 tools/refine_collection_motion.py

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'collection-afterimage-orbit 32s linear infinite' style.css
          grep -q 'blur(24px)' style.css
          grep -q 'seawater-sun-orbit 88s linear infinite' style.css
          grep -q 'seawater-cast-shadow 88s linear infinite' style.css

      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add style.css
          git commit -m 'Smooth collection motion and add seawater sunlight'
          git push
