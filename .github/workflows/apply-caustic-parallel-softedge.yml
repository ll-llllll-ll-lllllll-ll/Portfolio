name: Apply caustic parallel perspective and soft edge

on:
  push:
    paths:
      - '.github/workflows/apply-caustic-parallel-softedge.yml'
      - 'tools/apply_caustic_parallel_softedge.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply migration
        run: python3 tools/apply_caustic_parallel_softedge.py

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check script.js
          grep -q 'canvas2d-parallel3d-soft-caustics' script.js
          grep -q 'z: width <= 760 ? 1500 : 1900' script.js
          grep -q 'lowWidth = mobile ? 220 : 300' script.js
          grep -q 'Safari-safe geometric feather' script.js
          grep -q 'script.js?v=20261003-1645' index.html
          ! grep -q 'shadowBlur = edgeBlur' script.js

      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add script.js index.html
          git commit -m 'Refine caustic perspective and soft edges'
          git push
