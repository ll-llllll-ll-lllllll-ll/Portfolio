name: Apply image-proportional collection stage

on:
  push:
    paths:
      - '.github/workflows/apply-image-proportional-collection-stage.yml'
      - 'tools/apply_image_proportional_collection_stage.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python3 tools/apply_image_proportional_collection_stage.py

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check script.js
          grep -q 'stageWidthRatio = 1.70' script.js
          grep -q 'stageHeightRatio = 1.50' script.js
          grep -q 'sizeCollectionStages(item);' script.js
          grep -q 'width: var(--stage-width' style.css
          grep -q 'height: var(--stage-height' style.css

      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add style.css script.js
          git commit -m 'Size collection stages from artwork proportions'
          git push
