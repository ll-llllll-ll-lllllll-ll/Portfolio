name: Apply Canvas2D projected caustics

on:
  push:
    paths:
      - '.github/workflows/apply-canvas2d-projected-caustics.yml'
      - 'tools/apply_canvas2d_projected_caustics.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply migration
        run: python3 tools/apply_canvas2d_projected_caustics.py

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check script.js
          grep -q 'canvas2d-projected-caustics' script.js
          grep -q 'function projectRect' script.js
          grep -q 'function convexHull' script.js
          grep -q 'function renderLowField' script.js
          grep -q 'Seawater Canvas2D projected caustic volumes' style.css
          grep -q 'script.js?v=20261002-1625' index.html
          ! grep -q 'webgl-water-caustics-refraction' script.js

      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add script.js style.css index.html
          git commit -m 'Use projected Canvas2D water caustics for seawater collection'
          git push
