name: Apply dark theme

on:
  push:
    paths:
      - '.github/workflows/apply-dark-theme.yml'
      - 'tools/apply_dark_theme.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply dark theme
        run: python3 tools/apply_dark_theme.py

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Site-wide dark room theme' style.css
          grep -q -- '--paper: #0d0f0e' style.css
          grep -q 'fragrance-gallery' style.css
          grep -q 'room-view\[data-room="seawater"\]' style.css

      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add style.css
          git commit -m 'Try site-wide dark room theme'
          git push
