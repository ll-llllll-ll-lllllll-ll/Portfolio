name: Fix seawater scroll

on:
  push:
    paths:
      - '.github/workflows/fix-seawater-scroll.yml'
      - 'tools/fix_seawater_scroll.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fix
        run: python3 tools/fix_seawater_scroll.py
      - name: Validate
        run: |
          grep -q 'position: absolute;' style.css
          grep -q 'overflow-y: auto;' style.css
          grep -q 'touch-action: pan-y;' style.css
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add style.css
          git commit -m 'Restore seawater page scrolling'
          git push
