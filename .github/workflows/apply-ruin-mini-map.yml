name: Apply Ruin Archive mini-map

on:
  push:
    paths:
      - 'tools/apply-ruin-mini-map.py'
      - '.github/workflows/apply-ruin-mini-map.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-ruin-mini-map
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python tools/apply-ruin-mini-map.py

      - name: Validate site
        shell: bash
        run: |
          set -euo pipefail
          node --check script.js
          grep -q 'function mountRuinAtlasMiniMap' script.js
          grep -q 'html += renderRuinAtlasPreview();' script.js
          grep -q 'Ruin Archive lightweight Leaflet preview' style.css
          grep -q '<title>sky-sea-lake-cloud</title>' index.html
          if grep -RIniE '\bLQY\b' . \
            --exclude-dir=.git \
            --exclude-dir=tools \
            --exclude='apply-ruin-mini-map.yml'; then
            echo 'Found residual LQY identity in production files.'
            exit 1
          fi

      - name: Commit site changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git reset .github/workflows/apply-ruin-mini-map.yml tools/apply-ruin-mini-map.py
          if git diff --cached --quiet; then
            echo 'No site changes to commit.'
          else
            git commit -m 'Build lightweight Ruin Archive map preview'
            git push
          fi
