name: Apply one-point caustic perspective

on:
  push:
    paths:
      - '.github/workflows/apply-onepoint-caustic-perspective.yml'
      - 'tools/apply_onepoint_caustic_perspective.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply migration
        run: python3 tools/apply_onepoint_caustic_perspective.py

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check script.js
          grep -q 'canvas2d-onepoint-caustics' script.js
          grep -q 'One-point perspective optical volume' script.js
          grep -q 'function interpolateQuad' script.js
          grep -q 'Depth-banded caustics' script.js
          grep -q 'script.js?v=20261002-1652' index.html

      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add script.js index.html
          git commit -m 'Refine seawater caustics with one-point perspective and depth blur'
          git push
