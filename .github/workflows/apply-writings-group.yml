name: Apply portfolio writings group

on:
  push:
    paths:
      - 'apply-writings-group.py'
      - '.github/workflows/apply-writings-group.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python3 apply-writings-group.py

      - name: Validate JavaScript and expected changes
        shell: bash
        run: |
          set -euo pipefail
          node --check script.js
          grep -q 'const writings = \[' script.js
          grep -q 'Ruinwright Manifesto' script.js
          grep -q 'manifesto-assets/tenets/chapters/10.png' script.js
          grep -q '墟域图·遗构馆' script.js
          grep -q 'sky-sea-lake-cloud' index.html
          grep -q 'Writings / Ruinwright Manifesto' style.css

      - name: Commit site changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html script.js style.css
          if git diff --cached --quiet; then
            echo 'No site changes to commit.'
          else
            git commit -m 'Add writings and Ruinwright Manifesto'
            git push
          fi
