name: Apply refracted ripples

on:
  push:
    paths:
      - '.github/workflows/apply-refracted-ripples.yml'
      - 'tools/apply_refracted_ripples.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair migration replacement handling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/apply_refracted_ripples.py')
          s = p.read_text(encoding='utf-8')
          old = "js = pattern.sub(new_function + '\\n\\n  var collectionStageResizeFrame', js, count=1)"
          new = "js = pattern.sub(lambda _m: new_function + '\\n\\n  var collectionStageResizeFrame', js, count=1)"
          if old not in s:
              raise SystemExit('migration replacement line not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply migration
        run: python3 tools/apply_refracted_ripples.py

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check script.js
          grep -q 'webgl-refracted-ripples' script.js
          grep -q 'float refractedWake' script.js
          grep -q 'u_rect1' script.js
          ! grep -q 'var shadowCanvas = document.createElement' script.js
          grep -q 'Seawater refracted-ripple renderer' style.css
          grep -q 'script.js?v=20261002-1600' index.html

      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add script.js style.css index.html
          git commit -m 'Replace seawater shadows with refracted ripples'
          git push
