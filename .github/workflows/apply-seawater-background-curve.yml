name: Apply seawater background curve

on:
  push:
    paths:
      - '.github/workflows/apply-seawater-background-curve.yml'
      - 'tools/apply_seawater_background_curve.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply migration
        run: python3 tools/apply_seawater_background_curve.py

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check script.js
          grep -q 'seawaterBackgroundLevels = \[0, 20, 30, 40, 30, 20, 10, 0\]' script.js
          grep -q 'seawaterDeepRgb = \[146, 140, 128\]' script.js
          grep -q 'Keep the projected volume fully transparent' script.js
          grep -q 'Seawater scroll-linked background exposure' style.css
          grep -q 'script.js?v=20261003-0320' index.html
          ! grep -q 'rgba(126,126,126,0.085)' script.js

      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add script.js style.css index.html
          git commit -m 'Refine seawater caustic background exposure'
          git push
