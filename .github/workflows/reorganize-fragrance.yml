name: Reorganize fragrance assets

on:
  push:
    paths:
      - '.github/workflows/reorganize-fragrance.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reorganize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rename fragrance photographs sequentially
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          mapping = {
              'sky': [
                  '000057.jpg',
                  '462c9a97ap146b34bfe8f23096c2689d.jpg',
                  '608a07420r5cfad4735397269a857ccb.jpg',
                  '8f86c1e11paab3325da830066ad1b709.jpg',
                  'c0b5c2248ud2a095f952f58af6bd9fb9.jpg',
                  'd864ec74dt2c044147f641f235bc7b20.jpg',
                  'ddbfceb5ape4a16c6b7b9a181c9b3332.jpg',
                  'e2b56c3b4o3ebc958f52dd022d0490eb.jpg',
                  'f22a74cfeqc385f8e0853bae46b9d433.jpg',
              ],
              'cosmos': [
                  '000078.JPG',
                  '9fe84c63dta21e7ebf383cfe2d157f27.jpg',
                  'de10d8031s2de79ea47e293a9a1afd7c.jpg',
              ],
              'organs': [
                  '000108.jpg',
                  '000113.jpg',
                  '000134.jpg',
                  '4210c03c1g4345bb6213714d891fc932.jpg',
                  '6cec7b2f2v6092bdd583e55259903e7a.jpg',
                  '70a83cc2dt704a7046721cbe3efa8368.jpg',
                  'a2f29a837o20fd283566eb0a201bc7b1.jpg',
              ],
              'gallery': [
                  '000004.jpg',
                  '6e9fbf451q4bc131bd3cd08b3f8a5f87.jpg',
                  '7ee931d8cm935a65a2a083b603fc9f7c.jpg',
                  'IMG_3698.JPG',
              ],
              'eyes': [
                  '000070.JPG',
                  '580d71044uf482acbe8fe83889c90908.jpg',
                  '62defc0b3q1e47538697ef3691d9d352.jpg',
                  '6af5a5930i15445bd3770279dc2083fd.jpg',
                  'd8c1d9ddakfe606ae370b74f34b17a5c.jpg',
              ],
          }

          base = Path('collection/fragrance')
          replacements = {}

          for theme, files in mapping.items():
              folder = base / theme
              for index, old_name in enumerate(files, start=1):
                  old = folder / old_name
                  new_name = f'{index:02d}.jpg'
                  new = folder / new_name
                  if not old.exists():
                      raise SystemExit(f'Missing source file: {old}')
                  subprocess.run(['git', 'mv', str(old), str(new)], check=True)
                  replacements[old_name] = new_name

          script = Path('script.js')
          text = script.read_text(encoding='utf-8')
          for old, new in replacements.items():
              old_token = f'"{old}"'
              new_token = f'"{new}"'
              if old_token not in text:
                  raise SystemExit(f'Missing script reference: {old_token}')
              text = text.replace(old_token, new_token)
          script.write_text(text, encoding='utf-8')
          PY

      - name: Validate fragrance archive
        shell: bash
        run: |
          set -euo pipefail
          node --check script.js

          test "$(find collection/fragrance/sky -maxdepth 1 -type f -name '*.jpg' | wc -l)" -eq 9
          test "$(find collection/fragrance/cosmos -maxdepth 1 -type f -name '*.jpg' | wc -l)" -eq 3
          test "$(find collection/fragrance/organs -maxdepth 1 -type f -name '*.jpg' | wc -l)" -eq 7
          test "$(find collection/fragrance/gallery -maxdepth 1 -type f -name '*.jpg' | wc -l)" -eq 4
          test "$(find collection/fragrance/eyes -maxdepth 1 -type f -name '*.jpg' | wc -l)" -eq 5

          if find collection/fragrance -type f | grep -Eq '/[^/]*(IMG_|[0-9a-f]{6,}|[0-9]+[a-z][0-9a-z]+)'; then
            echo 'Unexpected legacy-style fragrance filename remains:'
            find collection/fragrance -type f
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path('script.js').read_text(encoding='utf-8')
          expected = {
              'sky': 9,
              'cosmos': 3,
              'organs': 7,
              'gallery': 4,
              'eyes': 5,
          }
          for theme, count in expected.items():
              for i in range(1, count + 1):
                  token = f'"{i:02d}.jpg"'
                  if token not in text:
                      raise SystemExit(f'Missing normalized script reference: {theme}/{i:02d}.jpg')
          print('Fragrance archive validation passed: 28 photographs.')
          PY

      - name: Commit normalized fragrance archive
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add collection/fragrance script.js
          git commit -m 'Normalize fragrance photograph filenames'
          git push
